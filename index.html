<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style/style.css">
    <title>B1 Tattoo</title>
</head>

<body>
    <section class="preloader">
        <div class="loader">
            <img src="img/logo-B1.png" alt="Logo b1 tattoo" class="img-logo">
            <div class="superior">
                <div class="box-sup"></div>
                <div class="box-sup"></div>
                <div class="box-sup"></div>
                <div class="box-sup"></div>
                <div class="box-sup"></div>
            </div>
            <div class="inferior">
                <div class="box-inf"></div>
                <div class="box-inf"></div>
                <div class="box-inf"></div>
                <div class="box-inf"></div>
                <div class="box-inf"></div>
            </div>
        </div>
    </section>

    <section class="hero espaco">
        <h1 class="titulo-hero">B1 tattoo</h1>

        <div class="hero-img">
            <img src="/img/hero/tattoo-hero.png" alt="tatuagem hero">
        </div>
        <div class="text-hero">
            <p>Tattoo alem da arte</p>
            <p>Scroll para explorar &darr;</p>
        </div>
    </section>

    <main class="espaco">
        <section class="sessao-trabalho">
            <div class="titulo-trabalho">
                <h1>obras selecionadas</h1>
            </div>
            <div class="galeria-scroll">
                <div class="conteiner">
                    <div class="grid">
                        <div class="grid-item">
                            <img src="img/Sessao_trabalho/pintura1.jpg" alt="pintura1">
                        </div>
                        <div class="grid-item">
                            <img src="img/Sessao_trabalho/Tatto4.jpg" alt="">
                        </div>
                        <div class="grid-item">
                            <img src="img/Sessao_trabalho/Tatto1.jpg" alt="">
                        </div>
                        <div class="grid-item">
                            <img src="img/Sessao_trabalho/Tatto2.jpg" alt="">
                        </div>
                        <div class="grid-item main-item">
                            <video loop muted playsinline>
                                <source src="img/Sessao_trabalho/video-trabalho.mp4" type="video/mp4">
                            </video>
                        </div>

                        <div class="grid-item">
                            <img src="img/Sessao_trabalho/pintura3.jpg" alt="">
                        </div>
                        <div class="grid-item">
                            <img src="img/Sessao_trabalho/pintura4.jpg" alt="">
                        </div>
                        <div class="grid-item">
                            <img src="img/Sessao_trabalho/Tatto3.jpg" alt="">
                        </div>
                        <div class="grid-item">
                            <img src="img/Sessao_trabalho/pintura2.jpg" alt="">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>

<script src="script/script.js" defer></script>

</html>
